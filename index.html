<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comic Collection</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--line:#e2e2de;--acc:#0a5bd3;--chip:#eef1f6;--n52:#0a7a3d;--dcy:#7a5a00;--uns:#8a3ab9;--no:#6b6b6b}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1d;--fg:#ececec;--mut:#9a9a9a;--line:#2e2e2e;--acc:#5b9bff;--chip:#262a31;--n52:#4cc985;--dcy:#e0b84a;--uns:#c98af0;--no:#9a9a9a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:24px 16px 8px;max-width:1300px;margin:auto}
h1{margin:0 0 4px;font-size:26px}
header p{margin:0;color:var(--mut)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1300px;margin:auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
input[type=search]{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
#count{margin-left:auto;color:var(--mut);font-size:13px}
main{max-width:1300px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--line)}
.meta{padding:8px 10px 10px}
.no{color:var(--mut);font-size:12px}
.t{font-weight:600;font-size:14px;margin:2px 0}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--chip);color:var(--mut)}
.s-N{color:var(--n52);font-weight:600}.s-Y{color:var(--dcy);font-weight:600}.s-U{color:var(--uns);font-weight:600}.s-X{color:var(--no)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}
dialog{border:0;padding:0;background:transparent;max-width:95vw;max-height:95vh}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{max-width:95vw;max-height:85vh;display:block;border-radius:6px}
dialog p{color:#fff;text-align:center;margin:8px 0 0}
@media (max-width:480px){main{grid-template-columns:repeat(2,1fr);gap:10px}}
</style>
</head>
<body>
<header>
<h1>Comic Collection</h1>
<p>244 comics &middot; DC, Marvel, Dark Horse, Image &middot; single issues, variants, 3D covers and trade paperbacks. Tap a cover to enlarge.</p>
</header>
<div class="bar"><div class="bar-in">
<input type="search" id="q" placeholder="Search title or issue..." aria-label="Search">
<select id="pub" aria-label="Publisher"><option value="">All publishers</option></select>
<select id="era" aria-label="New 52 status">
<option value="">All eras</option>
<option value="NY">New 52 era (incl. DC You)</option>
<option value="N">New 52</option>
<option value="Y">DC You 2015 (no New 52 logo)</option>
<option value="U">Unsure / Convergence</option>
<option value="X">Not New 52</option>
</select>
<div class="chips" id="kinds"></div>
<select id="sort" aria-label="Sort"><option value="n">Photo order</option><option value="t">Title A&ndash;Z</option></select>
<span id="count"></span>
</div></div>
<main id="grid"></main>
<dialog id="dlg"><img id="big" alt=""><p id="cap"></p></dialog>

const KN={R:"Regular",V:"Variant","3":"3D Cover",T:"TPB"}, SN={N:"New 52",Y:"DC You 2015",U:"Unsure",X:"Not New 52"};
const D=RAW.split("\n").map((l,i)=>{const[p,t,is,v,k,pub,s]=l.split("|");return{n:i+1,t,i:is,v,k:KN[k],pub,s,img:`img/IMG_${p}.jpg`}});

const $=id=>document.getElementById(id), esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const KINDS=["Regular","Variant","3D Cover","TPB"], on=new Set(KINDS);
[...new Set(D.map(d=>d.pub))].sort().forEach(p=>$("pub").add(new Option(`${p} (${D.filter(d=>d.pub==p).length})`,p)));
[...$("era").options].forEach(o=>{if(o.value)o.text+=` (${D.filter(d=>o.value.includes(d.s)).length})`});
KINDS.forEach(k=>{const b=document.createElement("button");b.className="chip";b.textContent=`${k} (${D.filter(d=>d.k==k).length})`;b.setAttribute("aria-pressed","true");
  b.onclick=()=>{on.has(k)?on.delete(k):on.add(k);b.setAttribute("aria-pressed",on.has(k));draw()};$("kinds").append(b)});
const name=d=>`${d.t} ${d.i==="TPB"?"(TPB)":d.i}${d.v?" — "+d.v:""}`;
function draw(){
  const q=$("q").value.toLowerCase().trim(), p=$("pub").value, e=$("era").value;
  let r=D.filter(d=>on.has(d.k)&&(!p||d.pub==p)&&(!e||e.includes(d.s))&&(!q||(name(d)+" "+d.pub).toLowerCase().includes(q)));
  if($("sort").value=="t")r=[...r].sort((a,b)=>a.t.localeCompare(b.t)||parseFloat(a.i.slice(1))-parseFloat(b.i.slice(1)));
  $("count").textContent=`${r.length} / ${D.length}`;
  $("grid").innerHTML=r.length?r.map(d=>`<article class="card" data-n="${d.n}"><img loading="lazy" src="${d.img}" alt="${esc(name(d))}"><div class="meta"><div class="no">#${d.n} · ${d.pub}</div><div class="t">${esc(d.t)} ${d.i==="TPB"?"":esc(d.i)}</div><div class="tags"><span class="tag s-${d.s}">${SN[d.s]}</span><span class="tag">${d.k}</span>${d.v&&d.k!=="3D Cover"?`<span class="tag">${esc(d.v)}</span>`:""}</div></div></article>`).join(""):'<p class="empty">No matches.</p>';
}
["q","pub","era","sort"].forEach(id=>$(id).addEventListener("input",draw));
$("grid").onclick=e=>{const c=e.target.closest(".card");if(!c)return;const d=D[c.dataset.n-1];$("big").src=d.img;$("big").alt=name(d);$("cap").textContent=`#${d.n} · ${name(d)} · ${d.pub} · ${SN[d.s]}`;$("dlg").showModal()};
$("dlg").onclick=()=>$("dlg").close();
draw();
</script>
